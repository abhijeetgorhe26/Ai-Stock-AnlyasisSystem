

services:
  frontend:
    build:
      context: ./frontend
    container_name: ai_stock_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: ai_stock_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=stock_db
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    command: ["npm", "run", "dev"]

  ai:
    build:
      context: ./ai
    container_name: ai_stock_ai
    ports:
      - "8000:8000"
    volumes:
      - ./ai:/app
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: ai_stock_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_stock_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
